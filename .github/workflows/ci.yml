name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && PYTHONPATH=src pytest -q tests
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
  sast-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install semgrep checkov && semgrep --config p/python --error src && checkov -d k8s --framework kubernetes --soft-fail
  image:
    runs-on: ubuntu-latest
    needs: [test, secrets, sast-iac]
    permissions: {contents: read, id-token: write, packages: write}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ks:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@0.28.0
        with: {image-ref: "ks:${{ github.sha }}", severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true}
      - uses: anchore/sbom-action@v0
        with: {image: "ks:${{ github.sha }}", format: spdx-json, output-file: sbom.spdx.json}
      # TODO(week 7): push to GHCR and `cosign sign` keyless (needs id-token: write, already granted)
