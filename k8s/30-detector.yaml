apiVersion: v1
kind: ServiceAccount
metadata: {name: ks-detector, namespace: ks-system}
automountServiceAccountToken: true
---
# Least privilege: the responder can only act inside ks-demo
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: ks-responder, namespace: ks-demo}
rules:
  - {apiGroups: [""], resources: [pods], verbs: [get, list, patch, delete]}
  - {apiGroups: [""], resources: [pods/log], verbs: [get]}
  - {apiGroups: [""], resources: [events], verbs: [list]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: ks-responder, namespace: ks-demo}
subjects: [{kind: ServiceAccount, name: ks-detector, namespace: ks-system}]
roleRef: {kind: Role, name: ks-responder, apiGroup: rbac.authorization.k8s.io}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ks-detector, namespace: ks-system}
spec:
  replicas: 1
  selector: {matchLabels: {app: ks-detector}}
  template:
    metadata: {labels: {app: ks-detector}}
    spec:
      serviceAccountName: ks-detector
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: detector
          image: kubesentinel:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - {name: HOME, value: "/tmp"}
            - {name: KS_INTERNAL_CIDRS, value: "10.96.0.0/12,192.168.0.0/16"}
            - {name: KS_MODE, value: "detect"}        # use "learn" first to record a real baseline
            - {name: KS_RESPONSE, value: "dry-run"}
            - {name: KS_KILL, value: "false"}
            - {name: KS_WINDOW_S, value: "10"}
            - name: KS_API_TOKEN
              valueFrom: {secretKeyRef: {name: ks-token, key: token}}
          volumeMounts: [{name: data, mountPath: /app/data}, {name: ev, mountPath: /app/evidence}, {name: tmp, mountPath: /tmp}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
      volumes: [{name: data, emptyDir: {}}, {name: ev, emptyDir: {}}, {name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: ks-detector, namespace: ks-system}
spec: {selector: {app: ks-detector}, ports: [{port: 8080, targetPort: 8080}]}
