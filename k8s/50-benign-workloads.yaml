# Benign "normal behaviour" for the learned baseline. Lab only.
apiVersion: v1
kind: Service
metadata: {name: victim-web, namespace: ks-demo}
spec: {selector: {app: victim-web}, ports: [{port: 80}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api-client, namespace: ks-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: api-client}}
  template:
    metadata: {labels: {app: api-client}}
    spec:
      containers:
        - name: c
          image: busybox:1.36
          command: ["sh","-c","while true; do wget -q -O- http://victim-web >/dev/null; sleep 2; done"]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: ks-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      containers:
        - name: c
          image: busybox:1.36
          command: ["sh","-c","while true; do sh -c 'date; ls /tmp' >/dev/null; wget -q -O- http://victim-web >/dev/null; sleep 6; done"]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: poller, namespace: ks-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: poller}}
  template:
    metadata: {labels: {app: poller}}
    spec:
      containers:
        - name: c
          image: busybox:1.36
          command: ["sh","-c","while true; do nc -z -w1 10.96.0.1 443; wget -q -O- http://victim-web >/dev/null; sleep 5; done"]
