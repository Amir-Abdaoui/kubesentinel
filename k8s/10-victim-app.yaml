# DELIBERATELY VULNERABLE workload (root, writable FS, SA token mounted, no limits). Lab only.
apiVersion: apps/v1
kind: Deployment
metadata: {name: victim-web, namespace: ks-demo, labels: {app: victim-web}}
spec:
  replicas: 1
  selector: {matchLabels: {app: victim-web}}
  template:
    metadata: {labels: {app: victim-web}}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          securityContext: {runAsUser: 0, allowPrivilegeEscalation: true}
